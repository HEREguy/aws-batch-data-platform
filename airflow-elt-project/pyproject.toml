[project]
name = "airflow_elt_project"
version = "0.1.0"
description = "AWS ELT Portfolio Project - Batch ELT pipeline with Airflow, S3, Glue, Athena, and dbt"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Core Airflow (matches Docker image)
    "apache-airflow==2.9.1",
    "apache-airflow-providers-amazon==8.16.0",
    "apache-airflow-providers-common-sql==1.7.0",
    "apache-airflow-providers-http==4.8.0",
    # dbt for transformations
    "dbt-core==1.8.0",
    "dbt-athena-community==1.8.1",
    # AWS SDK
    "boto3==1.34.0",
    "botocore==1.34.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    # Linting & formatting
    "ruff==0.5.0",
    "mypy==1.10.0",
    # Pre-commit
    "pre-commit==3.7.0",
    # Type stubs
    "types-requests==2.31.0",
]
test = [
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "moto==4.2.0",  # Mock AWS services for unit tests
]

[tool.uv]
dev-dependencies = [
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "ruff==0.5.0",
    "mypy==1.10.0",
    "pre-commit==3.7.0",
    "types-requests==2.31.0",
    "moto==4.2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # function calls in default arguments (common in Airflow)
]
per-file-ignores = { "tests/*" = ["S101", "S106"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["airflow_elt_project*"]
exclude = ["tests*", "dags*", "config*", "scripts*", "data*", "terraform*", "docs*"]