[core]
# The executor to use. LocalExecutor runs tasks in-process (no Celery/Redis needed)
executor = LocalExecutor

# Don't load example DAGs that come with Airflow
load_examples = False

# How long (in seconds) to wait for DAG imports before timing out
dagbag_import_timeout = 60

# The folder where your DAGs live
dags_folder = /opt/airflow/dags

# The folder where Airflow stores logs
base_log_folder = /opt/airflow/logs

# Logging level
logging_level = INFO

# Disable colored logs (cleaner in Docker)
colored_console_log = False

# Timezone for the Airflow instance
default_timezone = utc

# Maximum number of active DAG runs per DAG
max_active_runs_per_dag = 16

# Maximum number of task instances per DAG run
max_active_tasks_per_dag = 16

# Don't pickle DAGs (not needed for LocalExecutor)
donot_pickle = True

[database]
# SQLAlchemy connection string for the metadata database
# Uses the postgres service from docker-compose
sql_alchemy_conn = postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

# Connection pool settings
sql_alchemy_pool_enabled = True
sql_alchemy_pool_size = 5
sql_alchemy_max_overflow = 10
sql_alchemy_pool_recycle = 1800

[webserver]
# Secret key for Flask session encryption (set via env var in production)
secret_key = changeme

# Webserver port
web_server_port = 8080

# Enable access to the UI without authentication (for local dev only)
# In production, use proper authentication
authenticate = False

# Base URL for the webserver
base_url = http://localhost:8080

# Default UI timezone
default_ui_timezone = utc

[scheduler]
# How often (in seconds) to scan for new DAGs
dag_dir_list_interval = 30

# How often (in seconds) to check for task instances to schedule
scheduler_heartbeat_sec = 5

# Run the scheduler in the same process as the webserver (not recommended for production)
# We run scheduler separately in docker-compose
run_duration = -1

[logging]
# Log to stdout/stderr for Docker logging
logging_level = INFO
colored_console_log = False

# Log format
log_format = [%(asctime)s] {%(filename)s:%(lineno)d} %(levelname)s - %(message)s
simple_log_format = %(asctime)s %(levelname)s - %(message)s

# Log filename template
log_filename_template = {{ ti.dag_id }}/{{ ti.task_id }}/{{ ts }}/{{ try_number }}.log
log_processor_filename_template = {{ filename }}.log

[metrics]
# StatsD metrics (disabled for local dev)
statsd_on = False

[secrets]
# Use environment variables for secrets (no backend needed for local dev)
backend = 

[api]
# Enable the REST API
auth_backends = airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session